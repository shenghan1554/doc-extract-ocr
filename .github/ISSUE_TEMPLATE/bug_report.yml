name: Bug 报告
description: 报告识别错误、导出异常、摄像头或启动问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索[已有 Issue](https://github.com/shenghan1554/doc-extract-ocr/issues)，避免重复。
        请勿上传包含敏感信息的文档；截图/样例请先脱敏。
  - type: input
    id: version
    attributes:
      label: 软件版本
      placeholder: "1.0.1"
    validations:
      required: true
  - type: dropdown
    id: runmode
    attributes:
      label: 运行方式
      options:
        - 安装版（Setup.exe）
        - 便携版（Portable.zip）
        - 从源码运行（python app.py）
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 系统与硬件
      description: Windows 版本、位数、CPU（Win7 请注明是否 SP1 与补丁）
      placeholder: "Windows 11 23H2 x64 / i5-8250U"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 文字识别不准
        - 表格识别/合并单元格错误
        - PDF 逐页识别
        - Word / PDF / Excel 导出
        - 摄像头拍照
        - 启动失败 / 报错
        - 安装或卸载
        - 其他
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 上传 ...
        3. 出现 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / 报错日志
      description: 控制台输出、`outputs/` 下日志；**请先删除路径与文档内容中的个人信息**
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已在最新版本复现
          required: true
        - label: 我已搜索过已有 Issue
          required: true
        - label: 我没有上传含敏感信息的原始文档
          required: true